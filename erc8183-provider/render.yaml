services:
  - type: web
    name: stivium-erc8183-provider
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NETWORK
        value: bsc-testnet
      - key: ERC8183_SERVICE_PRICE
        value: "1000000000000000000"
      - key: ERC8183_FUNDED_POLL_INTERVAL
        value: "30"
      - key: PRIVATE_KEY
        sync: false
      - key: WALLET_PASSWORD
        sync: false
      - key: ERC8183_AGENT_URL
        value: "https://stivium-erc8183-provider.onrender.com/erc8183"
      - key: A2A_BASE_URL
        value: "https://stivium-erc8183-provider.onrender.com"
      - key: AGENT_NAME
        value: "STIVIUM ERC-8183 Provider"
      - key: AGENT_DESCRIPTION
        value: "STIVIUM provider for ERC-8183 commerce tasks."
